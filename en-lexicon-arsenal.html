<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇武器库 — 渐进式英语辩论词汇</title>
<style>
:root{--bg:#141418;--surface:#1a1a20;--border:#282830;--text:#9999a2;--text-strong:#b0b0b6;--text-muted:#5e5e6a;--accent:#6e80c4;--accent-dim:rgba(110,128,196,0.12);--red:#a06050;--red-dim:rgba(160,96,80,0.10);--green:#4a8060;--gold:#a07840;--purple:#7a5cc4;--jp-color:#c09060;--radius:10px;--font:'Segoe UI',system-ui,-apple-system,'Microsoft YaHei',sans-serif;--shadow:0 4px 16px rgba(0,0,0,0.4);--overlay-bg:rgba(0,0,0,0.6);--pop-bg:#1e1e28}
[data-theme="light"]{--bg:#f5f4f0;--surface:#eeede8;--border:#d8d6d0;--text:#5d5c58;--text-strong:#3a3936;--text-muted:#8c8a84;--accent:#5a6ab0;--accent-dim:rgba(90,106,176,0.10);--red:#a05040;--red-dim:rgba(160,80,64,0.08);--green:#4a7058;--gold:#8a6830;--purple:#6a4cb0;--jp-color:#9a7040;--shadow:0 4px 16px rgba(0,0,0,0.12);--overlay-bg:rgba(0,0,0,0.35);--pop-bg:#fafaf6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.9;overflow:hidden;transition:background 0.3s,color 0.3s}
#app{display:flex;height:100vh;max-width:1400px;margin:0 auto}
#sidebar{width:350px;min-width:350px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:background 0.3s,border-color 0.3s}
#sidebar-header{padding:10px 14px 2px;border-bottom:1px solid var(--border);transition:border-color 0.3s}
#sidebar-header h1{font-size:0.95rem;font-weight:700;color:var(--text-strong);letter-spacing:0.04em}
#mode-tabs{display:flex;gap:2px;margin-top:6px}
.mode-tab{flex:1;padding:6px 0;text-align:center;font-size:0.76rem;font-weight:600;cursor:pointer;border-radius:7px 7px 0 0;color:var(--text-muted);background:transparent;border:1px solid transparent;transition:all 0.2s;letter-spacing:0.03em;user-select:none}
.mode-tab.active{color:var(--accent);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);margin-bottom:-1px}
.mode-tab:hover:not(.active){color:var(--text)}
#theme-row{display:flex;justify-content:flex-end;margin-top:-22px;margin-right:2px}
#theme-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all 0.25s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

/* 词汇模式 */
#vocab-panel{display:flex;flex-direction:column;flex:1;overflow:hidden}
#vocab-panel.hidden{display:none}
#search-row{display:flex;gap:6px;padding:6px 12px}
#search-input{flex:1;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.86rem;font-family:var(--font);outline:none;transition:border-color 0.2s,background 0.3s}
#search-input:focus{border-color:var(--accent)}#search-input::placeholder{color:var(--text-muted)}
#btn-ai-search{padding:7px 10px;border-radius:7px;background:var(--accent);color:#e0e0e8;border:none;cursor:pointer;font-size:0.74rem;font-weight:600;font-family:var(--font);white-space:nowrap;display:none;letter-spacing:0.03em}
#btn-ai-search:hover{opacity:0.85}#btn-ai-search:disabled{opacity:0.5;cursor:not-allowed}
#ai-hint{font-size:0.68rem;color:var(--accent);padding:2px 12px 0;display:none;line-height:1.6}
#word-count{font-size:0.68rem;color:var(--text-muted);padding:2px 12px 6px}
#word-list{flex:1;overflow-y:auto;padding:0 6px 6px}
#word-list::-webkit-scrollbar{width:4px}#word-list::-webkit-scrollbar-track{background:transparent}#word-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
/* 备份工具栏 */
#backup-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--border);font-size:0.7rem;color:var(--text-muted);flex-shrink:0;transition:border-color 0.3s}
#backup-bar .bb-stat{flex:1;font-size:0.66rem}
#backup-bar button{padding:3px 8px;border-radius:5px;font-size:0.66rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font);transition:all 0.15s;white-space:nowrap}
#backup-bar button:hover{border-color:var(--accent);color:var(--accent)}
#backup-bar button.bb-export{background:var(--accent-dim);color:var(--accent);border-color:transparent}
#backup-bar button.bb-export:hover{background:var(--accent);color:#e0e0e8}
.word-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background 0.15s;margin-bottom:1px;font-size:0.9rem}
.word-item:hover{background:var(--accent-dim)}.word-item.active{background:var(--accent-dim);border-left:2px solid var(--accent);padding-left:8px}
.word-item .wi-word{font-weight:600;color:var(--text-strong)}.word-item .wi-def{font-size:0.72rem;color:var(--text-muted);margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.word-item .wi-status{font-size:0.65rem;color:var(--gold);margin-left:4px}

/* 句子翻译模式 */
#sentence-panel{display:none;flex-direction:column;flex:1;overflow:hidden}
#sentence-panel.visible{display:flex}
#sent-input-wrap{padding:8px 12px}
#sent-input{width:100%;min-height:80px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.86rem;font-family:var(--font);outline:none;resize:vertical;transition:border-color 0.2s,background 0.3s}
#sent-input:focus{border-color:var(--accent)}#sent-input::placeholder{color:var(--text-muted)}
#btn-translate-wrap{padding:0 12px 8px;display:flex;gap:6px}
#btn-translate{padding:7px 16px;border-radius:7px;background:var(--accent);color:#e0e0e8;border:none;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:var(--font);letter-spacing:0.03em}
#btn-translate:hover{opacity:0.85}#btn-translate:disabled{opacity:0.5;cursor:not-allowed}

/* 主面板 */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
#main::-webkit-scrollbar{width:5px}#main::-webkit-scrollbar-track{background:transparent}#main::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted)}
#empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:0.5}
#empty-state p{font-size:0.88rem;max-width:360px;text-align:center;line-height:1.7}
#detail{padding:24px 28px 36px;max-width:780px;display:none}
#detail.visible{display:block}

.detail-header{margin-bottom:16px}.detail-word{font-size:1.9rem;font-weight:700;color:var(--text-strong)}
.phonetics-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.phonetic-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:16px;font-size:0.76rem;font-weight:500;background:var(--surface);border:1px solid var(--border)}
.phonetic-tag .plabel{font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em}
.phonetic-tag.ipa .pval{color:var(--accent)}.phonetic-tag.cn .pval{color:var(--red)}.phonetic-tag.jp .pval{color:var(--purple)}

.loading-bar{height:2px;background:var(--border);border-radius:2px;margin:10px 0;overflow:hidden}
.loading-bar .fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width 0.5s;animation:loadPulse 1.5s infinite}
@keyframes loadPulse{0%,100%{opacity:0.5}50%{opacity:1}}
.loading-text{font-size:0.75rem;color:var(--text-muted);padding:4px 0}

.definition-block{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.def-card{background:var(--surface);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border)}
.def-card .def-lang{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.def-card.cn .def-lang{color:var(--red)}.def-card.jp .def-lang{color:var(--jp-color)}
.def-card .def-text{font-size:0.9rem;color:var(--text);line-height:1.75}

.synonyms-section{margin-bottom:20px}.syn-title{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.syn-title::after{content:'';flex:1;height:1px;background:var(--border)}
.syn-list{display:flex;flex-wrap:wrap;gap:7px}
.syn-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:140px;flex:1}
.syn-card .syn-word{font-weight:700;color:var(--accent);font-size:0.86rem;margin-bottom:2px}
.syn-card .syn-def-cn{font-size:0.76rem;color:var(--text);line-height:1.5}.syn-card .syn-def-jp{font-size:0.73rem;color:var(--jp-color);line-height:1.5}

.pronunciation-guide{background:var(--surface);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;border:1px solid var(--border)}
.pronunciation-guide .guide-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold);margin-bottom:10px}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guide-item{background:var(--bg);border-radius:8px;padding:10px 12px}.guide-item.full{grid-column:1/-1}
.guide-item .gi-label{font-size:0.62rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.guide-item .gi-value{font-size:0.86rem;color:var(--text);line-height:1.7}.guide-item .gi-highlight{color:var(--accent);font-weight:600}

.section{margin-bottom:24px}.section-title{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.sentence-card{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.sentence-card .s-line{padding:4px 0;line-height:1.7;font-size:0.86rem}
.sentence-card .s-line.zh{color:var(--red);font-weight:600;border-bottom:1px dashed var(--border);padding-bottom:6px}
.sentence-card .s-line.en{color:var(--text-strong);font-style:italic;border-bottom:1px dashed var(--border);padding-bottom:6px}
.sentence-card .s-line.ja{color:var(--jp-color)}
.s-label{display:inline-block;font-size:0.56rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-right:6px;padding:1px 4px;border-radius:3px}
.s-label.zh{background:var(--red-dim);color:var(--red)}.s-label.en{background:var(--accent-dim);color:var(--accent)}.s-label.ja{background:rgba(192,144,96,0.12);color:var(--jp-color)}

.usage-block{background:var(--surface);border-radius:var(--radius);padding:12px 16px;font-size:0.84rem;line-height:1.75}
.tags-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:0.66rem;padding:2px 8px;border-radius:10px;background:var(--accent-dim);color:var(--accent)}

/* 句子翻译结果 */
#sent-result{padding:20px 28px;display:none}
#sent-result.visible{display:block}
.sent-original{font-size:1.1rem;color:var(--text-strong);margin-bottom:14px;line-height:2;font-style:italic}
.sent-trans{margin-bottom:12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.sent-trans .st-lang{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:4px}
.sent-trans .st-text{font-size:0.92rem;line-height:2}
.sent-trans.cn .st-lang{color:var(--red)}.sent-trans.en .st-lang{color:var(--accent)}.sent-trans.ja .st-lang{color:var(--jp-color)}

.clickable-word{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent);position:relative;transition:color 0.15s}
.clickable-word:hover{color:var(--text-strong);border-bottom-color:var(--text-strong)}

/* 单词弹出卡片 */
.word-popover{position:fixed;z-index:400;background:var(--pop-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;min-width:200px;max-width:280px;box-shadow:0 8px 30px rgba(0,0,0,0.5);font-size:0.85rem;display:none}
.word-popover .pop-word{font-weight:700;color:var(--accent);font-size:1rem;margin-bottom:4px}
.word-popover .pop-def{color:var(--text);margin-bottom:4px;line-height:1.6}
.word-popover .pop-def-jp{color:var(--jp-color);font-size:0.8rem;margin-bottom:6px;line-height:1.5}
.word-popover .pop-actions{display:flex;gap:6px;margin-top:6px}
.word-popover .pop-btn{padding:4px 10px;border-radius:5px;font-size:0.72rem;font-weight:600;cursor:pointer;border:none;font-family:var(--font)}
.pop-btn.add{background:var(--accent);color:#e0e0e8}.pop-btn.add:hover{opacity:0.85}
.pop-btn.view{background:var(--bg);color:var(--text);border:1px solid var(--border)}.pop-btn.view:hover{border-color:var(--text-muted)}
.pop-btn:disabled{opacity:0.5;cursor:not-allowed}

#fab{position:fixed;bottom:28px;right:28px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#e0e0e8;border:none;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform 0.15s,opacity 0.15s;z-index:100}
#fab:hover{transform:scale(1.08);opacity:0.9}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:18px;font-size:0.82rem;font-weight:600;z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s;background:var(--green);color:#e0e0e8}
#toast.show{opacity:1}#toast.error{background:var(--red)}

/* 模态框 */
#modal-overlay{position:fixed;inset:0;background:var(--overlay-bg);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.2s}
#modal-overlay.open{opacity:1;pointer-events:auto}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;width:600px;max-width:95vw;max-height:88vh;overflow-y:auto}
#modal h2{font-size:0.95rem;font-weight:700;color:var(--text-strong);margin-bottom:14px}
.form-group{margin-bottom:8px}.form-group label{display:block;font-size:0.66rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.form-group input,.form-group textarea{width:100%;padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:0.84rem;font-family:var(--font);outline:none;resize:vertical}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}.form-group textarea{min-height:44px}
.form-row{display:flex;gap:7px}.form-row .form-group{flex:1}
.form-hint{font-size:0.62rem;color:var(--text-muted);margin-top:1px}
.sentence-section-toggle{font-size:0.74rem;color:var(--accent);cursor:pointer;font-weight:600;padding:5px 0;display:flex;align-items:center;gap:4px;user-select:none}
.sentence-section-toggle .arrow{transition:transform 0.2s;display:inline-block}.sentence-section-toggle.open .arrow{transform:rotate(90deg)}
.sentence-inputs{display:none}.sentence-inputs.open{display:block}
.btn-row{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:7px;font-size:0.8rem;font-weight:600;cursor:pointer;border:none;font-family:var(--font);letter-spacing:0.03em}.btn-primary{background:var(--accent);color:#e0e0e8}.btn-primary:hover{opacity:0.85}.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--text-muted)}.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);margin-right:auto}.btn-danger:hover{background:var(--red-dim)}
.delete-confirm{font-size:0.8rem;color:var(--red);margin-top:3px;display:none}.delete-confirm.show{display:block}.delete-confirm a{text-decoration:none;font-weight:600}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeSlideIn 0.2s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;margin-right:5px;vertical-align:middle}
@media(max-width:768px){#app{flex-direction:column}#sidebar{width:100%;min-width:0;height:auto;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}#main{height:auto}#detail{padding:14px 10px 22px}.detail-word{font-size:1.3rem}.definition-block{grid-template-columns:1fr}.guide-grid{grid-template-columns:1fr}.syn-card{min-width:110px}#fab{bottom:14px;right:14px;width:40px;height:40px;font-size:1.1rem}}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
<div id="sidebar-header">
<div id="theme-row"><button id="theme-toggle" title="暗黑/白天">🌓</button></div>
<h1>词汇武器库</h1>
<div id="mode-tabs">
<div class="mode-tab active" data-mode="vocab">📖 词汇搜索</div>
<div class="mode-tab" data-mode="sentence">📝 句子翻译</div>
</div>
</div>

<!-- 词汇模式 -->
<div id="vocab-panel">
<div id="search-row"><input type="text" id="search-input" placeholder="输入英语单词搜索或按 Enter AI 添加…" autocomplete="off"><button id="btn-ai-search">AI 添加</button></div>
<div id="ai-hint"></div><div id="word-count"></div><div id="word-list"></div><div id="backup-bar"><span class="bb-stat" id="bb-stat"></span><button class="bb-export" id="btn-export" title="导出全部数据为JSON文件">📥 导出</button><button id="btn-import" title="从JSON文件导入数据">📤 导入</button><input type="file" id="import-file" accept=".json" style="display:none"></div>
</div>

<!-- 句子翻译模式 -->
<div id="sentence-panel">
<div id="sent-input-wrap"><textarea id="sent-input" placeholder="输入一句英语，获得自然的中文和日语翻译。复杂的概念用简单的词汇表达。翻译结果中的每个单词都可以点击查看释义并添加到武器库。"></textarea></div>
<div id="btn-translate-wrap"><button id="btn-translate">🔍 翻译句子</button></div>
</div>
</aside>

<main id="main">
<div id="empty-state"><div class="icon">&#9876;</div><p>输入英语单词按 Enter 通过 AI 自动补全<br><small style="color:var(--text-muted)">渐进加载：释义 → 发音 → 例句</small></p></div>
<div id="detail"></div>
<div id="sent-result"></div>
</main>
</div>
<div id="toast"></div>
<div class="word-popover" id="word-popover"></div>
<button id="fab" title="手动添加">+</button>

<!-- 模态框 -->
<div id="modal-overlay"><div id="modal">
<h2 id="modal-title">添加单词</h2>
<div class="form-row"><div class="form-group"><label>单词 *</label><input id="f-word" placeholder="sovereignty"></div><div class="form-group"><label>IPA</label><input id="f-ipa" placeholder="/ˈsɒv.rɪn.ti/"></div></div>
<div class="form-row"><div class="form-group"><label>中文谐音</label><input id="f-cn" placeholder="索弗润提"></div><div class="form-group"><label>日语ローマ字</label><input id="f-jp" placeholder="sovurinti"></div></div>
<div class="form-row"><div class="form-group"><label>中文释义</label><input id="f-def-cn" placeholder="主权；最高统治权"></div><div class="form-group"><label>日语释义（汉字注假名）</label><input id="f-def-jp" placeholder="主権(しゅけん)"></div></div>
<div class="form-group"><label>细致谐音</label><input id="f-detailed-phonetic" placeholder="sóv-rìn-tì → 索́弗润̀替̀"></div>
<div class="form-row"><div class="form-group"><label>嘴型</label><textarea id="f-mouth-shape"></textarea></div><div class="form-group"><label>发声技巧</label><textarea id="f-voice-technique"></textarea></div></div>
<div class="form-group"><label>使用场合</label><textarea id="f-usage"></textarea></div>
<div class="sentence-section-toggle" id="sentence-toggle"><span class="arrow">▶</span> 武器句子（三语 · 中→英→日）</div>
<div class="sentence-inputs" id="sentence-inputs">
<div class="form-row"><div class="form-group"><label>🇨🇳 中文</label><textarea id="f-s-zh"></textarea></div><div class="form-group"><label>🇬🇧 英文</label><textarea id="f-s-en"></textarea></div></div>

'},{zh:'别说那么花，说重点。',en:"Skip the decoration. Get to the point.",ja:'飾(かざ)りはいいから、要点(ようてん)を言(い)って。'}],synonyms:[{word:'eloquence',definitionCn:'口才；能说会道',definitionJp:'話(はな)し上手(じょうず)；口(くち)がうまいこと'},{word:'sophistry',definitionCn:'诡辩；歪理',definitionJp:'こじつけ；詭弁(きべん)'}],tags:['语言','说服','欺骗']},{id:'3',word:'premise',ipa:'/ˈprem.ɪs/',chinesePhonetic:'普瑞米斯',japaneseRomaji:'puremisu',definitionCn:'前提；出发点；你论证所站的那块地',definitionJp:'前提(ぜんてい)；話(はなし)の出発点(しゅっぱつてん)；土台(どだい)',detailedPhonetic:'pré-mìs → 普瑞́密̀斯',mouthShape:'双唇/p/爆破→卷舌/r/→半开/e/→闭/m/鼻音→窄/ɪ/→/s/气流。',voiceTechnique:'从/p/清爆不振动，/r/开始声带。尾音/s/清收干净。',usageContext:'辩论拆解第一步：拒绝前提，整个论证就塌了。',sentences:[{zh:'我不接你的前提——你把结论藏在第一句话里了。',en:"I don't accept your starting point. You hid your conclusion in the first sentence.",ja:'その前提(ぜんてい)は受(う)け入(い)れられない。最初(さいしょ)の文(ぶん)に結論(けつろん)を隠(かく)してるじゃないか。'},{zh:'一旦你认了他们的前提，后面就只是算数。不认前提，全塌。',en:"Once you accept their premise, the rest is just arithmetic. Reject it, and it all falls.",ja:'相手(あいて)の前提(ぜんてい)を認(みと)めたら、あとは計算(けいさん)するだけ。前提(ぜんてい)を断(ことわ)れば全部(ぜんぶ)崩(くず)れる。'},{zh:'你的整场论证站在一个你自己都没想过要辩护的前提上。',en:"Your whole argument stands on a premise you never thought to defend.",ja:'あなたの議論(ぎろん)全体(ぜんたい)は、自分(じぶん)でも弁護(べんご)しようと思(おも)ったことがない前提(ぜんてい)の上(うえ)に立(た)ってるよ。'}],synonyms:[{word:'assumption',definitionCn:'假设；想当然',definitionJp:'仮定(かてい)；思(おも)い込(こ)み'},{word:'foundation',definitionCn:'地基；根基',definitionJp:'土台(どだい)；基礎(きそ)'}],tags:['逻辑','辩论','批判思维']}];

function filterLocal(term){if(!term)return words;var t=term.toLowerCase();return words.filter(function(w){return w.word.toLowerCase().indexOf(t)!==-1||(w.chinesePhonetic||'').indexOf(term)!==-1||(w.japaneseRomaji||'').toLowerCase().indexOf(t)!==-1||(w.definitionCn||'').indexOf(term)!==-1||(w.definitionJp||'').indexOf(term)!==-1||(w.tags||[]).some(function(tg){return tg.toLowerCase().indexOf(t)!==-1;})||(w.synonyms||[]).some(function(sy){return sy.word.toLowerCase().indexOf(t)!==-1||(sy.definitionCn||'').indexOf(term)!==-1;});});}

function renderList(term){term=(term||'').trim();var filtered=filterLocal(term);$c.textContent=filtered.length+' 个单词'+(term?'（"'+esc(term)+'"）':'');var ex=term?matchLocal(term.toLowerCase()):null;if(term&&!ex&&/^[a-zA-Z]+$/.test(term)){$h.style.display='block';$h.textContent='未找到「'+esc(term)+'」，按 Enter AI 渐进加载（释义→发音→例句）';$b.style.display='inline-block';$b.disabled=apiBusy;}else{$h.style.display='none';$b.style.display='none';}$l.innerHTML=filtered.map(function(w){var cls=w.id===activeId?' active':'';var dp=(w.definitionCn||'').slice(0,14);var status=(w._loading?' <span class="wi-status">加载中…</span>':'');return'<div class="word-item'+cls+'" data-id="'+esc(w.id)+'"><span class="wi-word">'+esc(w.word)+'</span><span class="wi-def">'+esc(dp)+'</span>'+status+'</div>';}).join('');$l.querySelectorAll('.word-item').forEach(function(el){el.addEventListener('click',function(){selectWord(el.dataset.id);});});updateBackupBar();}

function selectWord(id){activeId=id;var w=words.find(function(x){return x.id===id;});if(!w)return;renderList($s.value);$e.style.display='none';$sr.classList.remove('visible');$sr.style.display='none';$d.classList.add('visible');$d.style.display='block';$d.classList.add('fade-in');setTimeout(function(){$d.classList.remove('fade-in');},200);
var synHtml=w.synonyms&&w.synonyms.length?'<div class="synonyms-section"><div class="syn-title">近义词</div><div class="syn-list">'+(w.synonyms||[]).map(function(sy){return'<div class="syn-card"><div class="syn-word">'+esc(sy.word)+'</div><div class="syn-def-cn">'+esc(sy.definitionCn||'')+'</div><div class="syn-def-jp">'+(sy.definitionJp?furi(sy.definitionJp):'')+'</div></div>';}).join('')+'</div></div>':'';
var guideHtml=w.detailedPhonetic||w.mouthShape||w.voiceTechnique?'<div class="pronunciation-guide"><div class="guide-title">🔊 发音指导</div><div class="guide-grid">'+(w.detailedPhonetic?'<div class="guide-item full"><div class="gi-label">细致谐音</div><div class="gi-value"><span class="gi-highlight">'+esc(w.detailedPhonetic)+'</span></div></div>':'')+(w.mouthShape?'<div class="guide-item"><div class="gi-label">👄 嘴型</div><div class="gi-value">'+esc(w.mouthShape)+'</div></div>':'')+(w.voiceTechnique?'<div class="guide-item"><div class="gi-label">🎤 发声技巧</div><div class="gi-value">'+esc(w.voiceTechnique)+'</div></div>':'')+'</div></div>':'';
var sentsHtml=(w.sentences||[]).map(function(s,i){var zh=typeof s==='string'?'':(s.zh||'');var en=typeof s==='string'?s:(s.en||'');var ja=typeof s==='string'?'':(s.ja||'');return'<div class="sentence-card"><div class="s-line zh"><span class="s-label zh">中</span>'+(zh?esc(zh):'—')+'</div><div class="s-line en"><span class="s-label en">EN</span>'+esc(en)+'</div><div class="s-line ja"><span class="s-label ja">日</span>'+(ja?furi(ja):'—')+'</div></div>';}).join('');

var tagsHtml=(w.tags||[]).map(function(t){return'<span class="tag">'+esc(t)+'</span>';}).join('');
$d.innerHTML='<div class="detail-header"><div class="detail-word">'+esc(w.word)+'</div><div class="phonetics-row">'+(w.ipa?'<span class="phonetic-tag ipa"><span class="plabel">IPA</span><span class="pval">'+esc(w.ipa)+'</span></span>':'')+(w.chinesePhonetic?'<span class="phonetic-tag cn"><span class="plabel">谐音</span><span class="pval">'+esc(w.chinesePhonetic)+'</span></span>':'')+(w.japaneseRomaji?'<span class="phonetic-tag jp"><span class="plabel">ローマ字</span><span class="pval">'+esc(w.japaneseRomaji)+'</span></span>':'')+'</div></div>'+loadingBar+(w.definitionCn||w.definitionJp?'<div class="definition-block">'+(w.definitionCn?'<div class="def-card cn"><div class="def-lang">🇨🇳 中文释义</div><div class="def-text">'+esc(w.definitionCn)+'</div></div>':'')+(w.definitionJp?'<div class="def-card jp"><div class="def-lang">🇯🇵 日本語訳</div><div class="def-text">'+furi(w.definitionJp)+'</div></div>':'')+'</div>':'')+synHtml+guideHtml+(w.usageContext?'<div class="section"><div class="section-title">使用场合</div><div class="usage-block">'+esc(w.usageContext)+'</div></div>':'')+(sentsHtml?'<div class="section"><div class="section-title">武器句子 · 中→英→日</div>'+sentsHtml+'</div>':'')+(tagsHtml?'<div class="section"><div class="section-title">标签</div><div class="tags-row">'+tagsHtml+'</div>':'')+'<div style="margin-top:14px;"><button class="btn btn-secondary" onclick="window.editWord(\''+w.id+'\')" style="font-size:0.73rem;padding:4px 10px;">编辑</button></div>';
}

// ═══════ 渐进式 API 加载 ═══════
function apiCall(sysPrompt,userMsg,maxTok){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+AK},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:sysPrompt},{role:'user',content:userMsg}],temperature:0.7,max_tokens:maxTok||1500})}).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();}).then(function(d){var c=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;if(!c)throw new Error('空响应');var j=c.trim();var m=j.match(/```(?:json)?\s*\n?([\s\S]*?)\n?```/);if(m)j=m[1].trim();return JSON.parse(j);});}

function startProgressiveAdd(word){
  if(apiBusy)return;apiBusy=true;$b.disabled=true;$s.disabled=true;
  // 创建骨架
  var skel={id:gid(),word:word,ipa:'',chinesePhonetic:'',japaneseRomaji:'',definitionCn:'',definitionJp:'',detailedPhonetic:'',mouthShape:'',voiceTechnique:'',usageContext:'',sentences:[],synonyms:[],tags:[],_loading:true,_loadPhase:5,_loadMsg:'正在加载中文释义…'};
  words.unshift(skel);save();activeId=skel.id;renderList('');selectWord(skel.id);$l.scrollTop=0;

  // 阶段1：释义 + IPA + 基本谐音（最快）
  var p1='为英语单词"'+word+'"生成JSON。日语必须用日常自然的口语表达，不要学术化的晦涩翻译。复杂概念用简单词汇。只返回JSON。字段：ipa,chinesePhonetic,japaneseRomaji,definitionCn(中文释义，简洁自然),definitionJp(日语释义，口语化，汉字后括号注假名如 主権(しゅけん)),tags(3-5个中文标签)。';
  apiCall(p1,'快速生成"'+word+'"的基本信息',800).then(function(d){
    var w=words.find(function(x){return x.id===skel.id;});
    if(!w)return;
    w.ipa=d.ipa||'';w.chinesePhonetic=d.chinesePhonetic||'';w.japaneseRomaji=d.japaneseRomaji||'';
    w.definitionCn=d.definitionCn||'';w.definitionJp=d.definitionJp||'';w.tags=d.tags||[];
    w._loadPhase=40;w._loadMsg='释义完成，正在加载发音指导…';
    save();if(activeId===w.id){selectWord(w.id);$l.scrollTop=0;}
    // 阶段2：发音指导 + 使用场合
    var p2='为"'+word+'"生成JSON。字段：detailedPhonetic(细致中文谐音含重音标注),mouthShape(中文嘴型描述),voiceTechnique(中文发声技巧),usageContext(中文使用场合)。只返回JSON。';
    return apiCall(p2,'生成"'+word+'"的发音指导',600);
  }).then(function(d){
    if(!d)return;
    var w=words.find(function(x){return x.id===skel.id;});
    if(!w)return;
    w.detailedPhonetic=d.detailedPhonetic||'';w.mouthShape=d.mouthShape||'';w.voiceTechnique=d.voiceTechnique||'';w.usageContext=d.usageContext||'';
    w._loadPhase=70;w._loadMsg='发音指导完成，正在生成例句和近义词…';
    save();if(activeId===w.id){selectWord(w.id);$l.scrollTop=0;}
    // 阶段3：例句 + 近义词（最重）
    var p3='为"'+word+'"生成JSON。例句和近义词。日语必须日常口语化，用简单词汇表达复杂意思，不要生硬直译。字段：sentences(3个对象{zh,en,ja}，吵架/辩论风格，ja中汉字后括号注假名)，synonyms(3-4个对象{word,definitionCn,definitionJp}，definitionJp汉字后括号注假名)。只返回JSON。';
    return apiCall(p3,'生成"'+word+'"的例句和近义词',1500);
  }).then(function(d){
    var w=words.find(function(x){return x.id===skel.id;});
    if(!w)return;
    if(d){
      w.sentences=(d.sentences||[]).map(function(s){return{zh:s.zh||'',en:s.en||'',ja:s.ja||''};});
      w.synonyms=(d.synonyms||[]).map(function(sy){return{word:sy.word||'',definitionCn:sy.definitionCn||'',definitionJp:sy.definitionJp||''};});
    }
    delete w._loading;delete w._loadPhase;delete w._loadMsg;
    w._loadPhase=100;
    save();if(activeId===w.id)selectWord(w.id);$l.scrollTop=0;
    toast('✅ '+word+' 加载完成');
  }).catch(function(err){
    var w=words.find(function(x){return x.id===skel.id;});
    if(w){delete w._loading;delete w._loadPhase;delete w._loadMsg;}
    save();if(activeId===w.id)selectWord(w.id);
    console.error(err);toast('❌ 加载失败：'+err.message,true);
  }).finally(function(){
    apiBusy=false;$b.disabled=false;$s.disabled=false;$s.value='';renderList('');$s.focus();
  });
}

// ═══════ 句子翻译 ═══════
function translateSentence(text){
  if(apiBusy||!text.trim())return;apiBusy=true;$bt.disabled=true;$bt.textContent='翻译中…';
  var prompt='翻译下面的英语句子。要求：日语和中文都要日常口语化、自然流畅，不要生硬直译。复杂概念用简单词汇表达。返回JSON格式：{original:"原句",zh:"中文翻译(自然口语)",ja:"日语翻译(口语化,汉字后括号注假名)"}。只返回JSON。';
  apiCall(prompt,'翻译：'+text,1000).then(function(d){
    $sr.innerHTML='<div class="sent-trans en"><div class="st-lang">🇬🇧 原文</div><div class="st-text">'+makeClickable(d.original||text)+'</div></div><div class="sent-trans cn"><div class="st-lang">🇨🇳 中文</div><div class="st-text">'+esc(d.zh||'')+'</div></div><div class="sent-trans ja"><div class="st-lang">🇯🇵 日本語</div><div class="st-text">'+furi(d.ja||'')+'</div></div>';
    $sr.classList.add('visible');$sr.style.display='block';$d.classList.remove('visible');$d.style.display='none';$e.style.display='none';
    bindClickableWords();
  }).catch(function(err){console.error(err);toast('翻译失败：'+err.message,true);
  }).finally(function(){apiBusy=false;$bt.disabled=false;$bt.textContent='🔍 翻译句子';});
}

function makeClickable(text){
  if(!text)return'';
  return text.replace(/([a-zA-Z]+)/g,'<span class="clickable-word" data-word="$1">$1</span>');
}

function bindClickableWords(){
  $sr.querySelectorAll('.clickable-word').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();showWordPopover(el,el.dataset.word);});
  });
}

function showWordPopover(el,word){
  popoverWord=word;
  var rect=el.getBoundingClientRect();
  var existing=matchLocal(word.toLowerCase());
  var html='<div class="pop-word">'+esc(word)+'</div>';
  if(existing){
    html+='<div class="pop-def">'+esc(existing.definitionCn||'')+'</div><div class="pop-def-jp">'+furi(existing.definitionJp||'')+'</div>';
    html+='<div class="pop-actions"><button class="pop-btn view" onclick="window.selectWord(\''+existing.id+'\');window.closePopover();">查看完整</button></div>';
  }else{
    html+='<div class="pop-def" style="color:var(--text-muted)">词库中暂无此词</div><div class="pop-actions"><button class="pop-btn add" id="pop-add-btn">AI 添加到武器库</button></div>';
  }
  $pp.innerHTML=html;
  var left=rect.left+window.scrollX;var top=rect.bottom+window.scrollY+4;
  if(left+260>window.innerWidth)left=window.innerWidth-270;
  if(top+120>window.innerHeight)top=rect.top-130;
  $pp.style.left=left+'px';$pp.style.top=top+'px';$pp.style.display='block';

  var addBtn=document.getElementById('pop-add-btn');
  if(addBtn){addBtn.addEventListener('click',function(){closePopover();startProgressiveAdd(word);});}
}

function closePopover(){$pp.style.display='none';popoverWord=null;}
window.closePopover=closePopover;

// ═══════ 模态框 ═══════
function parseSyn(t){if(!t||!t.trim())return[];return t.split('\n').map(function(l){var p=l.split('|');if(p.length<2)return null;return{word:(p[0]||'').trim(),definitionCn:(p[1]||'').trim(),definitionJp:(p[2]||'').trim()};}).filter(Boolean);}
function synToText(s){if(!s||!s.length)return'';return s.map(function(x){return x.word+' | '+x.definitionCn+(x.definitionJp?' | '+x.definitionJp:'');}).join('\n');}
function openModal(mode,wid){editMode=(mode==='edit');editId=wid||null;$o.classList.add('open');$mt.textContent=editMode?'编辑':'手动添加';$bd.style.display=editMode?'inline-block':'none';$dc.classList.remove('show');$st.classList.add('open');$si.classList.add('open');if(editMode&&wid){var w=words.find(function(x){return x.id===wid;});if(w){F.w.value=w.word;F.ipa.value=w.ipa||'';F.cn.value=w.chinesePhonetic||'';F.jp.value=w.japaneseRomaji||'';F.dcn.value=w.definitionCn||'';F.djp.value=w.definitionJp||'';F.dp.value=w.detailedPhonetic||'';F.mo.value=w.mouthShape||'';F.vo.value=w.voiceTechnique||'';F.us.value=w.usageContext||'';var ss=w.sentences||[];if(ss.length&&typeof ss[0]==='object'){F.sz.value=ss.map(function(s){return s.zh||'';}).join('\n');F.se.value=ss.map(function(s){return s.en||'';}).join('\n');F.sj.value=ss.map(function(s){return s.ja||'';}).join('\n');}else{F.sz.value='';F.se.value=ss.map(function(s){return typeof s==='string'?s:(s.en||'');}).join('\n');F.sj.value='';}F.tg.value=(w.tags||[]).join(', ');F.sy.value=synToText(w.synonyms||[]);}}else{clearF();}}
function closeModal(){$o.classList.remove('open');clearF();}
function clearF(){F.w.value='';F.ipa.value='';F.cn.value='';F.jp.value='';F.dcn.value='';F.djp.value='';F.dp.value='';F.mo.value='';F.vo.value='';F.us.value='';F.sz.value='';F.se.value='';F.sj.value='';F.tg.value='';F.sy.value='';}
function saveFromModal(){var w=F.w.value.trim();if(!w){F.w.focus();return;}var z=F.sz.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);var e=F.se.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);var j=F.sj.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);var mx=Math.max(z.length,e.length,j.length);var ss=[];for(var i=0;i<mx;i++){ss.push({zh:z[i]||'',en:e[i]||'',ja:j[i]||''});}var d={id:editMode?editId:gid(),word:w,ipa:F.ipa.value.trim(),chinesePhonetic:F.cn.value.trim(),japaneseRomaji:F.jp.value.trim(),definitionCn:F.dcn.value.trim(),definitionJp:F.djp.value.trim(),detailedPhonetic:F.dp.value.trim(),mouthShape:F.mo.value.trim(),voiceTechnique:F.vo.value.trim(),usageContext:F.us.value.trim(),sentences:ss,synonyms:parseSyn(F.sy.value),tags:F.tg.value.split(',').map(function(s){return s.trim();}).filter(Boolean)};if(editMode){var idx=words.findIndex(function(x){return x.id===editId;});if(idx!==-1)words[idx]=d;}else{words.push(d);}save();closeModal();activeId=d.id;renderList($s.value);selectWord(d.id);toast(editMode?'已更新：'+w:'已添加：'+w);}
function delWord(){if(!editId)return;words=words.filter(function(x){return x.id!==editId;});save();closeModal();if(activeId===editId){activeId=null;$d.classList.remove('visible');$d.style.display='none';$e.style.display='flex';}renderList($s.value);}
function editWord(id){openModal('edit',id);}
window.editWord=editWord;window.selectWord=selectWord;

// ═══════ 模式切换 ═══════
function switchMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.toggle('active',t.dataset.mode===mode);});
  if(mode==='vocab'){$vp.classList.remove('hidden');$sp.classList.remove('visible');$sp.style.display='none';$vp.style.display='flex';$e.style.display='flex';$sr.classList.remove('visible');$sr.style.display='none';$d.classList.remove('visible');$d.style.display='none';if(words.length&&activeId)selectWord(activeId);}else{$vp.classList.add('hidden');$vp.style.display='none';$sp.classList.add('visible');$sp.style.display='flex';$sr.style.display='none';$d.classList.remove('visible');$d.style.display='none';$e.style.display='flex';$siw.focus();}
}

// ═══════ 事件 ═══════
document.querySelectorAll('.mode-tab').forEach(function(t){t.addEventListener('click',function(){switchMode(t.dataset.mode);});});
$s.addEventListener('input',function(){renderList($s.value);});
$s.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var t=$s.value.trim();if(!t||!/^[a-zA-Z]+$/.test(t))return;var ex=matchLocal(t.toLowerCase());if(ex){selectWord(ex.id);}else if(!apiBusy){startProgressiveAdd(t);}}});
$b.addEventListener('click',function(){var t=$s.value.trim();if(t&&/^[a-zA-Z]+$/.test(t)&&!apiBusy)startProgressiveAdd(t);});
$bt.addEventListener('click',function(){translateSentence($siw.value);});
$f.addEventListener('click',function(){openModal('add');});
$bc.addEventListener('click',closeModal);
$o.addEventListener('click',function(e){if(e.target===$o)closeModal();});
$bs.addEventListener('click',saveFromModal);
$bd.addEventListener('click',function(){$dc.classList.add('show');});
$cx.addEventListener('click',function(e){e.preventDefault();$dc.classList.remove('show');});
$cd.addEventListener('click',function(e){e.preventDefault();delWord();});
$th.addEventListener('click',toggleTheme);
$st.addEventListener('click',function(){$st.classList.toggle('open');$si.classList.toggle('open');});
document.addEventListener('click',function(e){if($pp.style.display==='block'&&!$pp.contains(e.target)&&!e.target.classList.contains('clickable-word'))closePopover();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($o.classList.contains('open'))closeModal();else if($pp.style.display==='block')closePopover();else$s.focus();}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$s.focus();}});

loadW();loadTheme();renderList('');if(words.length)selectWord(words[0].id);

// ═══════ 备份：导出/导入 ═══════
function updateBackupBar(){var total=words.length;var jsonSize=(new Blob([JSON.stringify(words)])).size;var sizeStr=jsonSize<1024?jsonSize+' B':jsonSize<1048576?(jsonSize/1024).toFixed(1)+' KB':(jsonSize/1048576).toFixed(1)+' MB';$bb.textContent=total+' 词 · '+sizeStr+' · 存储于浏览器 localStorage';}
function exportData(){var blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='lexicon-arsenal-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('📥 已导出 '+words.length+' 个单词的备份文件');}
function importData(file){if(!file)return;var reader=new FileReader();reader.onload=function(e){try{var data=JSON.parse(e.target.result);if(!Array.isArray(data))throw new Error('格式错误');var merged=confirm('检测到 '+data.length+' 个单词。\n\n「确定」= 合并入现有词库（同名覆盖）\n「取消」= 替换全部数据');if(merged){var map={};words.forEach(function(w){map[w.word.toLowerCase()]=w;});data.forEach(function(w){map[w.word.toLowerCase()]=w;});words=Object.values(map);}else{words=data;}save();renderList('');if(words.length)selectWord(words[0].id);$l.scrollTop=0;toast('📤 已导入 '+(merged?'合并':'替换')+'完成：'+words.length+' 个单词');}catch(err){toast('❌ 导入失败：文件格式不正确',true);}};reader.readAsText(file);}
$be.addEventListener('click',exportData);
$bi.addEventListener('click',function(){$if.click();});
$if.addEventListener('change',function(){if(this.files&&this.files[0]){importData(this.files[0]);this.value='';}});
})();
</script>
</body>
</html>
